name: Frontend Quality Gate

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'sih/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'feat/**'

jobs:
  check:
    name: Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Quality Gate (Lint + Build)
        run: npm run check
